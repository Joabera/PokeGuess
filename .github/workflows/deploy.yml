name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # Azure OIDC login
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish web app
        run: dotnet publish src/PokeGuess.Web -c Release -o publish

      - name: Assemble model files (ONNX from the models-v3 release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models-v3 --repo "${{ github.repository }}" -p "*.onnx" -D release
          # Inference service: both models for two-model routing.
          mkdir -p inference/models publish/models
          cp release/convnext_gen1-9.onnx release/resnet18_gen1.onnx inference/models/
          cp models/best_sketch_classes.txt models/class_names.txt models/class_names_v2.txt inference/models/
          # Web app /models/: the Live page's in-browser models (GPU fp32 + CPU int8).
          cp release/convnext_gen1-9.onnx release/convnext_gen1-9_int8.onnx publish/models/
          rm -rf inference/tests inference/pytest.ini inference/requirements-dev.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy inference
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_INFERENCE }}
          package: inference

      - name: Deploy web
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_WEB }}
          package: publish

      # OneDeploy can swap the files without recycling the .NET process. The old
      # process keeps the previous static-asset manifest (old hashes and lengths),
      # so pages keep referencing stale JS. Restart, then prove the live JS is new.
      - name: Restart web app
        run: |
          rg=$(az webapp list --query "[?name=='${{ vars.AZURE_WEBAPP_WEB }}'].resourceGroup" -o tsv)
          az webapp restart -g "$rg" -n "${{ vars.AZURE_WEBAPP_WEB }}"

      - name: Verify live site serves this build
        run: |
          url="https://${{ vars.AZURE_WEBAPP_WEB }}.azurewebsites.net/js/guess.js"
          for i in $(seq 1 20); do
            if curl -sf --max-time 60 "$url" -o live.js && cmp -s live.js publish/wwwroot/js/guess.js; then
              echo "Live guess.js matches the published build."; break
            fi
            if [ "$i" = 20 ]; then echo "::error::Live guess.js does not match the published build after restart"; exit 1; fi
            echo "Not updated yet (attempt $i), waiting..."; sleep 15
          done
          model="https://${{ vars.AZURE_WEBAPP_WEB }}.azurewebsites.net/models/convnext_gen1-9.onnx"
          expected=$(stat -c%s publish/models/convnext_gen1-9.onnx)
          actual=$(curl -sfI --max-time 60 "$model" | tr -d '\r' | awk 'tolower($1)=="content-length:" {print $2}')
          if [ "$actual" != "$expected" ]; then
            echo "::error::/models/convnext_gen1-9.onnx: expected $expected bytes, got '${actual:-no response}'"; exit 1
          fi
          echo "Live model served ($actual bytes)."
