name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # Azure OIDC login
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish web app
        run: dotnet publish src/PokeGuess.Web -c Release -o publish

      - name: Assemble inference package (ONNX models from the models-v1 release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inference/models
          gh release download models-v1 --repo "${{ github.repository }}" -p "*.onnx" -D inference/models
          cp models/best_sketch_classes.txt models/class_names.txt models/class_names_v2.txt inference/models/
          rm -rf inference/tests inference/pytest.ini inference/requirements-dev.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy inference
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_INFERENCE }}
          package: inference

      - name: Deploy web
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_WEB }}
          package: publish
